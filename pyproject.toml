[project]
name = "sre-agent-project"
version = "0.1.0"
description = "Reproducible diagnosis experiments around pinned HolmesGPT and SREGym"
requires-python = ">=3.12,<3.13"
dependencies = [
    "filelock>=3.18,<4",
    "paramiko>=4,<6",
    "pyyaml>=6,<7",
    "requests>=2.32.4,<3",
]

[dependency-groups]
dev = ["pre-commit>=4.2,<5", "pytest>=8.3,<9", "ruff==0.14.1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["scripts/**/*.py", "tests/**/*.py", "pyproject.toml"]
exclude = ["repos", "artifacts", ".research"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"
